    <!-- Single Page Apps for GitHub Pages
         https://github.com/rafgraph/spa-github-pages
         Restores the real path that 404.html stashed into the query string,
         so deep links (e.g. /games/some-slug) work when opened directly. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
